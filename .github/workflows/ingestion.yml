name: Refresh football data
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-data-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      PYTHONPATH: api:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Check required secrets without printing values
        run: |
          test -n "$DATABASE_URL" || { echo 'Configure INGEST_DATABASE_URL for the same database as the API'; exit 1; }
          test -n "$FOOTBALL_DATA_API_KEY" || { echo 'Configure FOOTBALL_DATA_API_KEY'; exit 1; }
      - run: pip install -r api/requirements.txt
      - run: python -m pipeline.worker --once
