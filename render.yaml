# Existing Render alternative. Worker creation can incur hosting charges;
# this file does not create a paid worker automatically. See DEPLOYMENT.md.
services:
  - type: web
    name: echo-madrid-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c 'cd /app/api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
